# Promtail config — agent-only (no local Loki).
# All ${VAR} placeholders are expanded from the environment at boot
# (-config.expand-env=true). Required env:
#   VSA_VPS_ID                     — e.g. vps-02
#   LOKI_URL                       — e.g. https://loki.flowbiz.ai/loki/api/v1/push
#   LOKI_BASIC_AUTH_USER           — basic-auth user
#   LOKI_BASIC_AUTH_PASSWORD       — basic-auth password

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /var/lib/promtail/positions.yml

clients:
  - url: ${LOKI_URL}
    tenant_id: default
    basic_auth:
      username: ${LOKI_BASIC_AUTH_USER}
      password: ${LOKI_BASIC_AUTH_PASSWORD}
    # Buffer locally if Loki is briefly unreachable, instead of dropping.
    backoff_config:
      min_period: 500ms
      max_period: 5m
      max_retries: 10

# Static label appended to every stream so the dashboard can filter by VPS.
# Could also be set per-job, but a global external label is simpler.
limits_config:
  readline_rate_enabled: false

scrape_configs:
  # 1. systemd journal — captures everything that talks to journald
  #    (sshd, ufw, docker daemon, vsa-agent.timer, etc.).
  - job_name: system-journal
    journal:
      path: /var/log/journal
      labels:
        job: systemd-journal
        vps_id: ${VSA_VPS_ID}
    relabel_configs:
      - source_labels: ['__journal__systemd_unit']
        target_label: systemd_unit

  # 2. nginx — JSON-formatted per-domain access logs from reverse-proxy.
  #    Matches the convention used by stacks/reverse-proxy:
  #      access_log /var/log/nginx/domains/<host>.access.json json_detailed;
  #    The host bind-mount lives at /srv/flowbiz/reverse-proxy/logs/.
  - job_name: nginx-domain-access
    static_configs:
      - targets: [localhost]
        labels:
          job: nginx-domain-access
          vps_id: ${VSA_VPS_ID}
          __path__: /srv/flowbiz/reverse-proxy/logs/domains/*.access.json
    pipeline_stages:
      - json:
          expressions:
            domain: domain
            remote_addr: remote_addr
            method: method
            uri: uri
            status: status
            body_bytes_sent: body_bytes_sent
            request_time: request_time
            upstream_response_time: upstream_response_time
            http_user_agent: http_user_agent
      - labels:
          domain:
          method:
          status:
      - timestamp:
          source: time
          format: "2006-01-02T15:04:05+07:00"
          location: Europe/Zurich

  - job_name: nginx-error
    static_configs:
      - targets: [localhost]
        labels:
          job: nginx-error
          vps_id: ${VSA_VPS_ID}
          __path__: /srv/flowbiz/reverse-proxy/logs/error*.log

  # 3. vsa CLI audit trail (JSONL).
  - job_name: vsa-audit
    static_configs:
      - targets: [localhost]
        labels:
          job: vsa-audit
          vps_id: ${VSA_VPS_ID}
          __path__: /var/log/vsa/audit.jsonl
    pipeline_stages:
      - json:
          expressions:
            actor: actor
            action: action
            result: result
            target: target
      - labels:
          actor:
          action:
          result:
      - timestamp:
          source: timestamp
          format: "2006-01-02T15:04:05.000Z"

  # 4. Docker — auto-discovers every container on the host and tails
  #    its stdout/stderr. Tagging is automatic via labels.
  - job_name: docker-containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 30s
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: container
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: compose_service
      - source_labels: ['__meta_docker_container_label_com_docker_compose_project']
        target_label: compose_project
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: stream
      - target_label: vps_id
        replacement: ${VSA_VPS_ID}
