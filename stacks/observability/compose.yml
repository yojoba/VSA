services:
  loki:
    image: grafana/loki:3.0.0
    restart: unless-stopped
    command: -config.file=/etc/loki/config/loki-config.yml
    volumes:
      - ./loki-config.yml:/etc/loki/config/loki-config.yml:ro
      - loki-data:/loki
    ports:
      - "${LOKI_HTTP_PORT:-3100}:3100"
    networks:
      - observability_internal
      - flowbiz_ext

  grafana:
    image: grafana/grafana:10.4.0
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      GF_SERVER_DOMAIN: ${GRAFANA_DOMAIN:-grafana.flowbiz.ai}
      GF_SERVER_ROOT_URL: https://${GRAFANA_DOMAIN:-grafana.flowbiz.ai}
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-changeme}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ${OBS_DATA_ROOT:-/srv/flowbiz/observability/data}/grafana-provisioning:/etc/grafana/provisioning
    depends_on:
      - loki
      - prometheus
    ports:
      - "${GRAFANA_HTTP_PORT:-3010}:3000"
    networks:
      - observability_internal
      - flowbiz_ext

  promtail:
    image: grafana/promtail:3.0.0
    restart: unless-stopped
    command: -config.file=/etc/promtail/config/promtail-config.yml
    volumes:
      - ./promtail-config.yml:/etc/promtail/config/promtail-config.yml:ro
      - promtail-data:/var/lib/promtail
      - /var/log:/var/log:ro
      - /srv/flowbiz:/srv/flowbiz:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/log/vsa:/var/log/vsa:ro
    networks:
      - observability_internal
    depends_on:
      - loki

  prometheus:
    image: prom/prometheus:v2.53.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=1GB
      - --web.external-url=https://${PROMETHEUS_DOMAIN:-prometheus.flowbiz.ai}
      - --web.route-prefix=/
      # Accept Prometheus remote-write from remote-VPS agents (vps-02/03),
      # proxied in via the loki.flowbiz.ai vhost (/prom/api/v1/write).
      - --web.enable-remote-write-receiver
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # Jeton porteur du scrape LokalFlash /_/metrics. Vit dans /etc/vsa
      # (root:65534, 0640) et JAMAIS dans ce depot : un secret ne se versionne pas.
      - /etc/vsa/lokalflash-metrics.token:/etc/prometheus/lokalflash-metrics.token:ro
      - prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_HTTP_PORT:-9090}:9090"
    networks:
      - observability_internal
      # Joined so the reverse-proxy nginx (flowbiz_ext only) can reach the
      # remote-write receiver — mirrors how loki is exposed.
      - flowbiz_ext

  node-exporter:
    image: prom/node-exporter:v1.8.1
    restart: unless-stopped
    command:
      - --path.rootfs=/host/rootfs
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($|/)
    volumes:
      - /:/host/rootfs:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
    ports:
      - "${NODE_EXPORTER_HTTP_PORT:-9100}:9100"
    networks:
      - observability_internal

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    restart: unless-stopped
    privileged: true
    # Tuned to cut CPU: cAdvisor's defaults collect dozens of metric groups
    # (disk, tcp/udp, process, sched, ...) every second on every cgroup. The
    # Fleet Overview dashboard only needs cpu/memory/network/last_seen, so we
    # disable the rest, scan only Docker cgroups, and slow housekeeping to 30s.
    command:
      - --housekeeping_interval=30s
      - --docker_only=true
      - --disable_metrics=disk,diskIO,tcp,udp,advtcp,sched,process,hugetlb,referenced_memory,cpu_topology,resctrl,percpu,memory_numa,perf_event
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    ports:
      - "${CADVISOR_HTTP_PORT:-8080}:8080"
    networks:
      - observability_internal

  # External synthetic probes of the public LokalFlash endpoints (K8s app +
  # website). Prometheus scrapes this via the "blackbox" job; blackbox reaches
  # the public internet through the bridge network's NAT. See blackbox.yml.
  blackbox-exporter:
    image: prom/blackbox-exporter:v0.25.0
    restart: unless-stopped
    command:
      - --config.file=/etc/blackbox/blackbox.yml
    volumes:
      - ./blackbox.yml:/etc/blackbox/blackbox.yml:ro
    ports:
      - "${BLACKBOX_HTTP_PORT:-9115}:9115"
    networks:
      - observability_internal

volumes:
  prometheus-data:
    name: obs-prometheus-data
  loki-data:
    name: obs-loki-data
  grafana-data:
    name: obs-grafana-data
  promtail-data:
    name: obs-promtail-data

networks:
  observability_internal:
    driver: bridge
  flowbiz_ext:
    external: true
