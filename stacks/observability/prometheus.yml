global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['prometheus:9090']

  - job_name: loki
    metrics_path: /metrics
    static_configs:
      - targets: ['loki:3100']

  - job_name: grafana
    metrics_path: /metrics
    static_configs:
      - targets: ['grafana:3000']

  - job_name: promtail
    metrics_path: /metrics
    static_configs:
      - targets: ['promtail:9080']

  # Host + container metrics for the hub itself. Stamp vps_id=vps-01 so these
  # sit alongside the remote-write metrics pushed by vps-02/03 (which carry
  # vps_id via the agent's external_labels) and share one dashboard filter.
  - job_name: node-exporter
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          vps_id: vps-01

  - job_name: cadvisor
    static_configs:
      - targets: ['cadvisor:8080']
        labels:
          vps_id: vps-01

  # Example scrape config for application metrics (uncomment and adjust)
  # - job_name: reverse-proxy
  #   static_configs:
  #     - targets: ['reverse-proxy-nginx:9113']

rule_files: []
