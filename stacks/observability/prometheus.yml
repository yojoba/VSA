global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['prometheus:9090']

  - job_name: loki
    metrics_path: /metrics
    static_configs:
      - targets: ['loki:3100']

  - job_name: grafana
    metrics_path: /metrics
    static_configs:
      - targets: ['grafana:3000']

  - job_name: promtail
    metrics_path: /metrics
    static_configs:
      - targets: ['promtail:9080']

  # Host + container metrics for the hub itself. Stamp vps_id=vps-01 so these
  # sit alongside the remote-write metrics pushed by vps-02/03 (which carry
  # vps_id via the agent's external_labels) and share one dashboard filter.
  - job_name: node-exporter
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          vps_id: vps-01

  - job_name: cadvisor
    static_configs:
      - targets: ['cadvisor:8080']
        labels:
          vps_id: vps-01

  # External synthetic probes (blackbox_exporter) of the public LokalFlash
  # endpoints. These run FROM the hub — off the K8s cluster — so they are a true
  # external uptime + TLS-expiry check that catches edge outages Sentry can't
  # see. probe_success + probe_ssl_earliest_cert_expiry feed the `vsa alert`
  # cron (problems_from_blackbox). vps_id=ext marks them as synthetic (not a
  # fleet host). app + www are Cloudflare DNS-only → the probe hits the K8s
  # ingress directly (true origin); apex is CF-proxied so it's left out to avoid
  # alerting on Cloudflare edge blips.
  - job_name: blackbox
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - https://app.lokalflash.ch/api/health
          - https://www.lokalflash.ch/
        labels:
          vps_id: ext
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # Example scrape config for application metrics (uncomment and adjust)
  # - job_name: reverse-proxy
  #   static_configs:
  #     - targets: ['reverse-proxy-nginx:9113']

rule_files: []
