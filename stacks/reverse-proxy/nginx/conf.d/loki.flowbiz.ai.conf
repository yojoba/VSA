server {
  listen 80;
  server_name loki.flowbiz.ai;
  location /.well-known/acme-challenge/ { root /var/www/certbot; }
  location / { return 301 https://$host$request_uri; }
}

server {
  listen 443 ssl;
  http2 on;
  server_name loki.flowbiz.ai;

  ssl_certificate     /etc/letsencrypt/live/loki.flowbiz.ai/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/loki.flowbiz.ai/privkey.pem;

  include /etc/nginx/snippets/security_headers.conf;
  access_log /var/log/nginx/domains/loki.flowbiz.ai.access.json json_detailed;

  # Loki streams can be large (batched log push); allow generous body sizes
  # and long-lived connections.
  client_max_body_size 50m;
  proxy_read_timeout 300s;
  proxy_send_timeout 300s;

  # Hard IP allow-list — only the known VSA agents may push.
  # Any new VPS in the fleet must be added here, then `nginx -s reload`.
  allow 84.234.20.142;     # vps-01 (flowbiz-1, hub itself — for local debug)
  allow 83.228.221.37;     # vps-02 (flowbiz-2)
  allow 83.228.221.109;    # vps-03 (flowbiz-3)
  deny all;

  # Defence-in-depth on top of the IP filter — basic auth still required
  # if the IP allow-list is ever loosened or bypassed.
  auth_basic "Loki Push";
  auth_basic_user_file /etc/nginx/auth/loki.flowbiz.ai.htpasswd;

  resolver 127.0.0.11 ipv6=off;
  set $upstream observability-loki-1:3100;

  location /healthz { return 200 "ok"; add_header Content-Type text/plain; }

  location / {
    proxy_pass http://$upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
