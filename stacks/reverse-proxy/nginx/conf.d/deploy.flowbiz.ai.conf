server {
  listen 80;
  server_name deploy.flowbiz.ai;
  location /.well-known/acme-challenge/ { root /var/www/certbot; }
  location / { return 301 https://$host$request_uri; }
}

server {
  listen 443 ssl;
  http2 on;
  server_name deploy.flowbiz.ai;

  ssl_certificate     /etc/letsencrypt/live/deploy.flowbiz.ai/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/deploy.flowbiz.ai/privkey.pem;

  include /etc/nginx/snippets/security_headers.conf;

  # HTTP Basic Auth
  auth_basic "Restricted Access";
  auth_basic_user_file /etc/nginx/auth/deploy.flowbiz.ai.htpasswd;
  access_log /var/log/nginx/domains/deploy.flowbiz.ai.access.json json_detailed;


  client_max_body_size 20m;
  proxy_read_timeout 120s;
  proxy_send_timeout 120s;

  resolver 127.0.0.11 ipv6=off;

  set $upstream deployer-deployer-1:8000;

  location /healthz { return 200 "ok"; add_header Content-Type text/plain; }

  location /webhook/ {
    auth_basic off;
    proxy_pass http://$upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /health {
    auth_basic off;
    proxy_pass http://$upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    proxy_pass http://$upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
