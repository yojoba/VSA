# c-living.flowbiz.ai — Prospection B2B, société Californian Living & Kooala (Amanda Moreno).
#
# 🔴 Vhost écrit à la main, PAS par `vsa site provision` : deux upstreams (le
# front, et l'API Go sous /api/). Voir prospect.flowbiz.ai.conf — même stack
# docker compose, la société est choisie par l'en-tête Host.

server {
  listen 80;
  server_name c-living.flowbiz.ai;
  location /.well-known/acme-challenge/ { root /var/www/certbot; }
  location / { return 301 https://$host$request_uri; }
}

server {
  listen 443 ssl;
  http2 on;
  server_name c-living.flowbiz.ai;

  ssl_certificate     /etc/letsencrypt/live/c-living.flowbiz.ai/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/c-living.flowbiz.ai/privkey.pem;

  include /etc/nginx/snippets/security_headers.conf;
  access_log /var/log/nginx/domains/c-living.flowbiz.ai.access.json json_detailed;

  client_max_body_size 8m;

  resolver 127.0.0.11 ipv6=off;
  set $api_upstream prospection-api:8080;
  set $web_upstream prospection-web:80;

  location /healthz { return 200 "ok"; add_header Content-Type text/plain; }

  location /api/ {
    proxy_pass http://$api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;
  }

  location / {
    proxy_pass http://$web_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
