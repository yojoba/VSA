# adminfree.ch — vhost du reverse-proxy VSA sur flowbiz-1.
# Déposé dans /srv/flowbiz/reverse-proxy/nginx/conf.d/ (voir README.md à côté).
#
# Une seule origine pour le navigateur : la PWA est servie par `adminfree-web`,
# l'API Go par `adminfree-api` sous /api/ — c'est ce qui permet au front d'être
# construit avec VITE_API_URL=https://adminfree.ch et de rester en TLS.
server {
  listen 80;
  server_name adminfree.ch www.adminfree.ch;
  location /.well-known/acme-challenge/ { root /var/www/certbot; }
  location / { return 301 https://$host$request_uri; }
}

server {
  listen 443 ssl;
  http2 on;
  server_name adminfree.ch www.adminfree.ch;

  ssl_certificate     /etc/letsencrypt/live/adminfree.ch/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/adminfree.ch/privkey.pem;

  include /etc/nginx/snippets/security_headers.conf;
  access_log /var/log/nginx/domains/adminfree.ch.access.json json_detailed;

  # Pas d'authentification nginx. Un Basic Auth a été essayé le 2026-09-06 et
  # RETIRÉ le jour même : le navigateur ne rattache pas les identifiants de la
  # porte aux appels `fetch` de l'app, nginx répondait 401 avant de lire le
  # corps de la requête, et Chrome remontait « Pas de connexion » à l'écran.
  # L'app était inutilisable. Si une porte redevient nécessaire, la poser
  # AILLEURS qu'au niveau HTTP : refus de l'inscription côté Go, ou filtrage
  # par IP — jamais un auth_basic devant une app qui porte son propre jeton.

  # Une photo de courrier compressée fait ~1,6 Mo, un PDF jusqu'à 15 Mo (limite API).
  client_max_body_size 20m;

  resolver 127.0.0.11 ipv6=off;
  set $api_upstream adminfree-api:8090;
  set $web_upstream adminfree-web:80;

  location /healthz { return 200 "ok"; add_header Content-Type text/plain; }

  # API. Les appels IA sont longs : extraction ~20-40 s, assistant droit
  # jusqu'à 4 min (timeout du serveur Go) — le proxy doit patienter plus.
  location /api/ {
    proxy_pass http://$api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_request_buffering off;
  }

  # La PWA (catch-all).
  location / {
    proxy_pass http://$web_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
