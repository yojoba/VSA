# tiptop.flowbiz.ai — Tout Tip Top : rapports de travail dictés des employés
# de Morgins Tout Tip Top Sàrl, rangés sur la fiche client (mandat FlowBiz).
#
# 🔴 Vhost écrit à la main, PAS par `vsa site provision` — même raison que
# voicenotes.flowbiz.ai.conf : DEUX upstreams (la PWA, et l'API Go sous
# /api/) et `security_headers_allow_mic.conf` (le gabarit de la CLI pose
# `Permissions-Policy: microphone=()` et tuerait la dictée).
#
# Stack docker compose propre (conteneurs `tiptop-web` et `tiptop-api`).
# Premier certificat : `tiptop/deploy/flowbiz-1/add-host.sh tiptop.flowbiz.ai`.
# Code : github.com/yojoba/tiptop.

server {
  listen 80;
  server_name tiptop.flowbiz.ai;
  location /.well-known/acme-challenge/ { root /var/www/certbot; }
  location / { return 301 https://$host$request_uri; }
}

server {
  listen 443 ssl;
  http2 on;
  server_name tiptop.flowbiz.ai;

  ssl_certificate     /etc/letsencrypt/live/tiptop.flowbiz.ai/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/tiptop.flowbiz.ai/privkey.pem;

  include /etc/nginx/snippets/security_headers_allow_mic.conf;
  access_log /var/log/nginx/domains/tiptop.flowbiz.ai.access.json json_detailed;

  # Un morceau d'audio fait 4 Mo ; marge pour un logo.
  client_max_body_size 20m;

  resolver 127.0.0.11 ipv6=off;
  set $api_upstream tiptop-api:8092;
  set $web_upstream tiptop-web:80;

  location /healthz { return 200 "ok"; add_header Content-Type text/plain; }

  # API : l'assemblage d'un audio vers S3 et l'analyse d'un rapport peuvent
  # prendre plusieurs minutes ; le corps des morceaux est transmis en flux.
  location /api/ {
    proxy_pass http://$api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_request_buffering off;
  }

  # La PWA (catch-all).
  location / {
    proxy_pass http://$web_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
