# prospect.flowbiz.ai — Prospection B2B, société flowbiz.ai (compte plateforme).
#
# 🔴 Vhost écrit à la main, PAS par `vsa site provision` : il faut DEUX
# upstreams (le front, et l'API Go sous /api/), que le gabarit de la CLI ne
# sait pas exprimer. Lancer `vsa site provision --domain prospect.flowbiz.ai`
# écraserait ce fichier et casserait l'API, en silence (`nginx -t` passe).
#
# Les domaines Prospection (prospect, c-living) partagent UNE stack docker
# compose (conteneurs `prospection-web` et `prospection-api`) : l'API choisit
# la société par l'en-tête Host. Code : dépôt `californian-living`, dossier
# `prospection/`. Déploiement : `vsa vhost sync`. Premier certificat :
# `prospection/deploy/flowbiz-1/add-host.sh <domaine>`.

server {
  listen 80;
  server_name prospect.flowbiz.ai;
  location /.well-known/acme-challenge/ { root /var/www/certbot; }
  location / { return 301 https://$host$request_uri; }
}

server {
  listen 443 ssl;
  http2 on;
  server_name prospect.flowbiz.ai;

  ssl_certificate     /etc/letsencrypt/live/prospect.flowbiz.ai/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/prospect.flowbiz.ai/privkey.pem;

  include /etc/nginx/snippets/security_headers.conf;
  access_log /var/log/nginx/domains/prospect.flowbiz.ai.access.json json_detailed;

  client_max_body_size 8m;

  resolver 127.0.0.11 ipv6=off;
  set $api_upstream prospection-api:8080;
  set $web_upstream prospection-web:80;

  location /healthz { return 200 "ok"; add_header Content-Type text/plain; }

  # API : une recherche web ou une campagne durent des minutes.
  location /api/ {
    proxy_pass http://$api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;
  }

  location / {
    proxy_pass http://$web_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
