# Default server for unmatched HTTP requests + the healthcheck endpoint.
# nginx loads conf.d/*.conf alphabetically, so the `00-` prefix makes this
# evaluate before the per-domain vhosts (which is fine — they each declare
# their own server_name and only fall through here on no match).
#
# Adding this fixes the `(unhealthy)` status that the reverse-proxy-nginx
# container had since deployment: the compose healthcheck calls
# `wget http://localhost/healthz`, which returned 404 because no vhost
# matched `localhost`.

server {
  listen 80 default_server;
  server_name _;

  location = /healthz {
    return 200 "ok\n";
    add_header Content-Type text/plain;
    access_log off;
  }

  # Reject unmatched hosts cleanly. 444 closes the connection without
  # responding, which keeps random scanners out of the access logs.
  location / {
    return 444;
  }
}
