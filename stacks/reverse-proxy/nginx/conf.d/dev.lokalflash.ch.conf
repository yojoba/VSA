server {
  listen 80;
  server_name dev.lokalflash.ch;
  location /.well-known/acme-challenge/ { root /var/www/certbot; }
  location / { return 301 https://$host$request_uri; }
}

server {
  listen 443 ssl;
  http2 on;
  server_name dev.lokalflash.ch;

  ssl_certificate     /etc/letsencrypt/live/dev.lokalflash.ch/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/dev.lokalflash.ch/privkey.pem;

  include /etc/nginx/snippets/security_headers.conf;
  access_log /var/log/nginx/domains/dev.lokalflash.ch.access.json json_detailed;


  client_max_body_size 20m;
  proxy_read_timeout 120s;
  proxy_send_timeout 120s;

  resolver 127.0.0.11 ipv6=off;

  set $route_1 lokalflash-frontend:80;
  set $route_2 lokalflash-pocketbase:8090;
  set $route_3 lokalflash-pocketbase:8090;

  location /healthz { return 200 "ok"; add_header Content-Type text/plain; }


  # Per-site Content-Security-Policy. Locks down what scripts / styles /
  # connect destinations are allowed. unsafe-inline + unsafe-eval are
  # required by Vite/MUI/emotion runtime; the rest is an allowlist of
  # the third parties this app actually talks to (Stripe, Google Maps,
  # Sentry EU). Tightened iteratively — start in Report-Only mode if
  # legitimate features start failing.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://js.stripe.com https://maps.googleapis.com https://*.googleapis.com https://*.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://dev.lokalflash.ch https://api.stripe.com https://maps.googleapis.com https://*.googleapis.com https://*.gstatic.com https://*.ingest.de.sentry.io wss://dev.lokalflash.ch; frame-src 'self' https://js.stripe.com https://hooks.stripe.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'" always;

  # Apple Pay domain verification. Stripe needs to fetch this exact path
  # to confirm we own the domain. Without the alias, nginx falls through
  # to the SPA index.html and Apple Pay verification fails.
  location = /.well-known/apple-developer-merchantid-domain-association {
    alias /etc/nginx/conf.d/well-known-lokalflash/apple-developer-merchantid-domain-association;
    default_type text/plain;
    add_header Cache-Control "public, max-age=86400" always;
    try_files $uri =404;
  }
  # PocketBase realtime SSE — explicit, dedicated location.
  # - HTTP/1.1 + empty Connection header so nginx doesn't terminate the stream.
  # - proxy_buffering off so SSE frames are flushed immediately to client.
  # - 24h read/send timeout so the long-lived stream isn't killed at 120s.
  # - Alt-Svc: clear so the browser drops any cached HTTP/3 endpoint for this
  #   path. Cloudflare advertises HTTP/3 by default; QUIC reconnects over a
  #   long-lived SSE channel cause Chrome to emit ERR_QUIC_PROTOCOL_ERROR
  #   mid-stream and the realtime channel desyncs (badge counts stop updating).
  location = /api/realtime {
    proxy_pass http://$route_2;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_http_version 1.1;
    proxy_set_header Connection '';
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 24h;
    proxy_send_timeout 24h;
    chunked_transfer_encoding on;

    add_header Alt-Svc 'clear' always;
    add_header Cache-Control 'no-store' always;
  }

  location /api/ {
    proxy_pass http://$route_2;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # SSE / streaming endpoints that share the /api/ prefix (e.g. Stripe webhooks
    # POSTs are short-lived but PB OAuth redirects use long-poll on first auth).
    proxy_http_version 1.1;
    proxy_set_header Connection '';
    proxy_buffering off;

    add_header Alt-Svc 'clear' always;
  }
  location /_/ {
    limit_req zone=dashboard burst=10 nodelay;
    proxy_pass http://$route_3;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    proxy_pass http://$route_1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
