# sia.flowbiz.ai — VoiceNotes (séances & procès-verbaux) pour LokalFlash Sàrl.
#
# 🔴 Vhost écrit à la main, PAS par `vsa site provision`. Le gabarit de la CLI
# (`templates/vhost_https.conf.j2`) n'a qu'un seul upstream et inclut
# `security_headers.conf`, qui pose `Permissions-Policy: microphone=()` et tue
# l'enregistrement. VoiceNotes a besoin de DEUX upstreams (la PWA, et l'API Go
# sous /api/) et du snippet `security_headers_allow_mic.conf`. Lancer
# `vsa site provision --domain sia.flowbiz.ai` écraserait ce fichier et
# casserait le micro et l'API.
#
# Déploiement : `vsa vhost sync` (rsync depuis ce dépôt vers le montage nginx,
# `nginx -t`, reload, ligne d'audit). Premier certificat :
# `voicenotes/deploy/flowbiz-1/add-host.sh <domaine>`.
#
# Les trois domaines VoiceNotes (sia, impact, osom) partagent UNE stack docker
# compose (conteneurs `voicenotes-web` et `voicenotes-api`) : l'API choisit la
# société par l'en-tête Host. Code : github.com/yojoba/voicenotes.

server {
  listen 80;
  server_name sia.flowbiz.ai;
  location /.well-known/acme-challenge/ { root /var/www/certbot; }
  location / { return 301 https://$host$request_uri; }
}

server {
  listen 443 ssl;
  http2 on;
  server_name sia.flowbiz.ai;

  ssl_certificate     /etc/letsencrypt/live/sia.flowbiz.ai/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/sia.flowbiz.ai/privkey.pem;

  include /etc/nginx/snippets/security_headers_allow_mic.conf;
  access_log /var/log/nginx/domains/sia.flowbiz.ai.access.json json_detailed;

  # Un morceau d'audio fait 4 Mo ; marge pour un logo ou un PATCH de PV.
  client_max_body_size 20m;

  resolver 127.0.0.11 ipv6=off;
  set $api_upstream voicenotes-api:8091;
  set $web_upstream voicenotes-web:80;

  location /healthz { return 200 "ok"; add_header Content-Type text/plain; }

  # API : l'assemblage d'un audio vers S3 et la régénération d'un PV peuvent
  # prendre plusieurs minutes ; le corps des morceaux est transmis en flux.
  location /api/ {
    proxy_pass http://$api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_request_buffering off;
  }

  # La PWA (catch-all).
  location / {
    proxy_pass http://$web_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
